name: Seed community surfaces

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  discussions: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create seeded issues and discussion threads
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/seed-community.mjs
