name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node brand/check-surfaces.mjs
      - run: pnpm -r build
      - run: pnpm typecheck
      - run: pnpm -r test
      - run: node --test scripts/*.test.mjs
