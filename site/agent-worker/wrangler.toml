name = "nominee-agent-demo"
main = "src/index.ts"
compatibility_date = "2026-06-20"
compatibility_flags = ["nodejs_compat"]

# Takes over the testbed URL once deployed
routes = [{ pattern = "nominee.dev/agent*", zone_name = "nominee.dev" }]

[vars]
# Verified Resend sending domain (shared with the cf-agent testbed).
FROM = "nominee <agent@email.nominee.dev>"

# Optional analytics — neither is a secret; see README "Optional analytics".
#
# CF_BEACON_TOKEN: Cloudflare Web Analytics site token (dashboard → Pages
# project → Web Analytics → manual setup → copy the token, not the snippet).
# Embedded in public HTML, so a plain [vars] entry — not `wrangler secret put`.
# Pages' automatic injection never reaches this worker (/agent* is separate).
# CF_BEACON_TOKEN = "..."

# rate-limit the real write action: 5 sessions / 60s / IP
[[ratelimits]]
name = "STAR_RL"
namespace_id = "2001"
simple = { limit = 5, period = 60 }

# The agent session IS a Durable Object: it hibernates while waiting for
# out-of-band (email) approval and resumes when the link is clicked. The token
# is re-resolved from Token Vault at action time, surviving the pause.
[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "AgentSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentSession"]

# Demo funnel events (session_start/blocked/approved/denied/published/error).
# DISABLED until Analytics Engine is enabled on the account (dashboard →
# Workers → Analytics Engine); a worker with this binding fails to deploy
# otherwise (error 10089). The code guards `Env.FUNNEL?`, so with the binding
# absent the funnel just no-ops — the demo works fully without it. To turn it
# back on: enable Analytics Engine in the dashboard, then uncomment this block.
# [[analytics_engine_datasets]]
# binding = "FUNNEL"
# dataset = "nominee_agent_funnel"

# Secrets (set with `wrangler secret put <NAME>`):
#   AUTH0_DOMAIN, AUTH0_CLIENT_ID, AUTH0_CLIENT_SECRET, SESSION_SECRET, RESEND_API_KEY,
#   NOMINEE_RECEIPT_KEY
