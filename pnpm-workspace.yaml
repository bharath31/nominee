packages:
  - "packages/*"
  - "examples/*"
  # The enforcement guarantees every release must keep. In the workspace so
  # `pnpm -r test` (and therefore CI) actually runs them.
  - "security-contract"
  # The deployed nominee.dev/agent worker lives here so it ships with the site.
  - "site/agent-worker"
  # The Vercel-side port of the static site + /agent Edge Function (middleware,
  # api/agent/*). Cloudflare's agent-worker above stays untouched and deployed
  # in parallel until DNS actually flips.
  - "site"

onlyBuiltDependencies:
  - "@biomejs/biome"
  - "esbuild"

overrides:
  "@changesets/parse>js-yaml": "^4.3.0"
  "gray-matter>js-yaml": "^3.15.0"
  "read-yaml-file>js-yaml": "^3.15.0"
  esbuild: "^0.28.1"
  human-id: "^3.0.0"
